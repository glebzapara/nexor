<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.1.1/bundles/stomp.umd.min.js"></script>

<script th:inline="javascript">

    const chatId = /*[[${id}]]*/ 1;

    const currentUserId = /*[[${currentUser.id}]]*/ null;

</script>

<script>

    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';

    const client = new StompJs.Client({
        brokerURL: protocol + '//' + window.location.host + '/ws'
    });

    const chatWindow = document.getElementById('chat-window');
    const messagesContainer = document.getElementById('messages-container');
    const messageInput = document.getElementById('message-input');
    const sendButton = document.getElementById('send-btn');

    client.onConnect = function () {

        console.log('WebSocket connected');

        client.subscribe('/topic/chat/' + chatId, function (message) {

            const data = JSON.parse(message.body);

            console.log('WebSocket message:', data);

            addMessage(
                data.senderId,
                data.senderName,
                data.text,
                data.createdAt
            );

        });

    };

    client.onStompError = function (frame) {

        console.error('STOMP error:', frame);

    };

    client.activate();

    function toggleChatList() {

        const chatList = document.getElementById('chat-list');

        chatList.classList.toggle('mobile-open');

    }

    sendButton.addEventListener('click', sendMessage);

    messageInput.addEventListener('keydown', function (event) {

        if (event.key === 'Enter') {

            event.preventDefault();

            sendMessage();

        }

    });

    function sendMessage() {

        const text = messageInput.value.trim();

        if (text === '') {
            return;
        }

        client.publish({

            destination: '/app/chat/' + chatId,

            body: JSON.stringify({
                text: text
            })

        });

        messageInput.value = '';

    }

    function addMessage(senderId, senderName, text, createdAt) {

        console.log(
            'Sender ID:',
            senderId,
            'Current User ID:',
            currentUserId
        );

        const isMyMessage =
            senderId !== null &&
            senderId !== undefined &&
            currentUserId !== null &&
            currentUserId !== undefined &&
            Number(senderId) === Number(currentUserId);

        const message = document.createElement('div');

        message.style.maxWidth = '65%';
        message.style.padding = '8px 12px';
        message.style.borderRadius = '8px';
        message.style.color = 'white';
        message.style.fontSize = '15px';
        message.style.lineHeight = '1.4';
        message.style.wordBreak = 'break-word';
        message.style.flexShrink = '0';

        if (isMyMessage) {

            message.style.background = '#005c4b';
            message.style.alignSelf = 'flex-end';
            message.style.borderTopRightRadius = '0';

        } else {

            message.style.background = '#202c33';
            message.style.alignSelf = 'flex-start';
            message.style.borderTopLeftRadius = '0';

        }

        const textElement = document.createElement('div');

        textElement.textContent = text;

        message.appendChild(textElement);

        const timeElement = document.createElement('span');

        timeElement.style.fontSize = '0.7rem';
        timeElement.style.color = '#8696a0';
        timeElement.style.textAlign = 'right';
        timeElement.style.marginTop = '4px';
        timeElement.style.display = 'block';

        if (createdAt) {

            const date = new Date(createdAt);

            if (!isNaN(date.getTime())) {

                timeElement.textContent = date.toLocaleTimeString('uk-UA', {
                    timeZone: 'Europe/Kyiv',
                    hour: '2-digit',
                    minute: '2-digit',
                    hour12: false
                });

            } else {

                timeElement.textContent = createdAt;

            }

        }

        message.appendChild(timeElement);

        messagesContainer.appendChild(message);

        chatWindow.scrollTop = chatWindow.scrollHeight;

    }

    function loadMessages() {

        fetch('/api/chats/' + chatId + '/messages')

            .then(response => {

                if (!response.ok) {

                    throw new Error(
                        'Failed to load messages: ' +
                        response.status
                    );

                }

                return response.json();

            })

            .then(messages => {

                console.log(
                    'Loaded messages:',
                    messages
                );

                messages.forEach(message => {

                    addMessage(
                        message.senderId,
                        message.senderName,
                        message.text,
                        message.createdAt
                    );

                });

                chatWindow.scrollTop =
                    chatWindow.scrollHeight;

            })

            .catch(error => {

                console.error(
                    'Error loading messages:',
                    error
                );

            });

    }

    loadMessages();

</script>
