<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexor</title>
    <link rel="icon" href="/images/favicon.ico">
    <style>
        #mobile-menu-btn { display: none; }

        @media (max-width: 700px) {
            nav { padding: 10px !important; }
            nav + div { position: relative; }

            #chat-list {
                display: none !important;
                overflow-y: auto !important;
                position: absolute !important;
                left: 0;
                top: 0;
                bottom: 0;
                width: 280px !important;
                z-index: 100;
                box-shadow: 5px 0 20px rgba(0,0,0,0.5);
            }

            #chat-list.mobile-open { display: flex !important; }

            nav + div > div:last-child {
                width: 100% !important;
                min-width: 0 !important;
            }

            nav + div > div:last-child > div:first-child {
                padding: 0 12px !important;
            }

            #mobile-menu-btn {
                display: flex !important;
                width: 40px !important;
                height: 40px !important;
                flex-shrink: 0 !important;
                border: none !important;
                border-radius: 8px !important;
                background: #2a3942 !important;
                color: #00a884 !important;
                font-size: 22px !important;
                align-items: center !important;
                justify-content: center !important;
                cursor: pointer !important;
                padding: 0 !important;
            }

            #mobile-search-btn { display: flex !important; }
            #mobile-search-row.mobile-search-open { display: block !important; }
            #chat-window { padding: 10px !important; }

            #message-composer {
                min-height: 58px !important;
                padding: 8px !important;
                gap: 6px !important;
            }

            #message-composer > div:first-child { gap: 4px !important; }

            #message-composer > div:first-child button {
                width: 36px !important;
                height: 36px !important;
                padding: 0 !important;
            }

            #message-input {
                min-width: 0 !important;
                height: 40px !important;
                padding: 9px 10px !important;
            }

            #send-btn {
                width: 40px !important;
                height: 40px !important;
            }

            #messages-container > div { max-width: 80% !important; }
        }
    </style>
</head>

                <span style="position:absolute;top:61%;left:31%;color:#8696a0;opacity:0.18;font-size:23px;white-space:nowrap;">✩♬ ₊.🎧⋆☾⋆⁺₊✧</span>

<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.1.1/bundles/stomp.umd.min.js"></script>

<script th:inline="javascript">
    const chatId = /*[[${id}]]*/ 1;
    const currentUserId = /*[[${currentUser.id}]]*/ null;
</script>

<script>
    const messagesById = new Map();
    const messagesContainer = document.getElementById('messages-container');
    const chatWindow = document.getElementById('chat-window');
    const messageInput = document.getElementById('message-input');
    const sendButton = document.getElementById('send-btn');
    let sending = false;

    const client = new StompJs.Client({
        brokerURL: (window.location.protocol === 'https:' ? 'wss://' : 'ws://') + window.location.host + '/ws',
        reconnectDelay: 5000,
        onConnect: () => {
            client.subscribe('/topic/chat/' + chatId, frame => {
                try {
                    upsertMessage(JSON.parse(frame.body));
                } catch (error) {
                    console.error('Failed to process incoming message:', error);
                }
            });
            loadMessages();
        },
        onStompError: frame => console.error('STOMP error:', frame.headers['message']),
        onWebSocketError: error => console.error('WebSocket error:', error)
    });

    function formatMessageTime(value) {
        if (!value) return '';
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return '';
        return date.toLocaleTimeString('uk-UA', {
            timeZone: 'Europe/Kyiv',
            hour: '2-digit',
            minute: '2-digit',
            hour12: false
        });
    }

    function addMessage(message) {
        const ownMessage = currentUserId != null && message.senderId != null &&
            String(message.senderId) === String(currentUserId);

        const element = document.createElement('div');
        element.style.maxWidth = '80%';
        element.style.padding = '8px 12px';
        element.style.borderRadius = '8px';
        element.style.color = '#e9edef';
        element.style.fontSize = '15px';
        element.style.lineHeight = '1.4';
        element.style.overflowWrap = 'anywhere';
        element.style.flexShrink = '0';
        element.style.boxSizing = 'border-box';
        element.style.background = ownMessage ? '#005c4b' : '#202c33';
        element.style.alignSelf = ownMessage ? 'flex-end' : 'flex-start';
        element.style.borderTopRightRadius = ownMessage ? '0' : '8px';
        element.style.borderTopLeftRadius = ownMessage ? '8px' : '0';

        if (!ownMessage && message.senderName) {
            const sender = document.createElement('div');
            sender.textContent = message.senderName;
            sender.style.color = '#53bdeb';
            sender.style.fontSize = '12px';
            sender.style.fontWeight = '600';
            sender.style.marginBottom = '4px';
            element.appendChild(sender);
        }

        const text = document.createElement('div');
        text.textContent = message.text == null ? '' : message.text;
        text.style.whiteSpace = 'pre-wrap';
        element.appendChild(text);

        const time = document.createElement('div');
        time.textContent = formatMessageTime(message.createdAt);
        time.style.fontSize = '10px';
        time.style.color = '#aebac1';
        time.style.textAlign = 'right';
        time.style.marginTop = '4px';
        element.appendChild(time);

        messagesContainer.appendChild(element);
    }

    function renderMessages() {
        const wasAtBottom =
            chatWindow.scrollHeight - chatWindow.scrollTop - chatWindow.clientHeight < 100;

        const messages = Array.from(messagesById.values()).sort((a, b) => {
            const first = new Date(a.createdAt).getTime();
            const second = new Date(b.createdAt).getTime();
            return (Number.isNaN(first) ? 0 : first) -
                (Number.isNaN(second) ? 0 : second);
        });

        messagesContainer.replaceChildren();
        messages.forEach(addMessage);

        if (wasAtBottom || messages.length <= 1) {
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }
    }

    function upsertMessage(message) {
        if (!message || message.id == null) {
            console.error('Received message without an ID:', message);
            return;
        }

        messagesById.set(String(message.id), message);
        renderMessages();
    }

    async function loadMessages() {
        try {
            const response = await fetch('/api/chats/' + chatId + '/messages');

            if (!response.ok) {
                throw new Error('Failed to load messages: ' + response.status);
            }

            const messages = await response.json();

            if (!Array.isArray(messages)) {
                throw new Error('Messages endpoint did not return an array');
            }

            messages.forEach(message => {
                if (message && message.id != null) {
                    messagesById.set(String(message.id), message);
                }
            });

            renderMessages();
        } catch (error) {
            console.error('Failed to load messages:', error);
        }
    }

    async function sendMessage() {
        const text = messageInput.value.trim();

        if (!text || sending) {
            return;
        }

        sending = true;
        sendButton.disabled = true;

        try {
            const response = await fetch('/api/chats/' + chatId + '/messages', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ text: text })
            });

            if (!response.ok) {
                throw new Error('Failed to send message: ' + response.status);
            }

            const contentType = response.headers.get('content-type') || '';

            if (contentType.includes('application/json')) {
                const message = await response.json();

                if (message && message.id != null) {
                    upsertMessage(message);
                }
            }

            messageInput.value = '';
            messageInput.focus();
            chatWindow.scrollTop = chatWindow.scrollHeight;
        } catch (error) {
            console.error('Failed to send message:', error);
        } finally {
            sending = false;
            sendButton.disabled = false;
        }
    }

    sendButton.addEventListener('click', sendMessage);

    messageInput.addEventListener('keydown', event => {
        if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            sendMessage();
        }
    });

    function toggleChatList() {
        document.getElementById('chat-list').classList.toggle('mobile-open');
    }

    function toggleMobileSearch() {
        const searchRow = document.getElementById('mobile-search-row');
        const searchInput = document.getElementById('mobile-search-input');

        searchRow.classList.toggle('mobile-search-open');

        if (searchRow.classList.contains('mobile-search-open')) {
            searchInput.focus();
        }
    }

    client.activate();
</script>

</body>
</html>
