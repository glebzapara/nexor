<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.1.1/bundles/stomp.umd.min.js"></script>

<script>

    const client = new StompJs.Client({
        brokerURL: 'ws://localhost:8080/ws'
    });

    const id = 1;

    const chatWindow = document.getElementById('chat-window');
    const messageInput = document.getElementById('message-input');
    const sendButton = document.getElementById('send-btn');

    client.onConnect = function () {

        console.log("WebSocket connected");

        client.subscribe('/topic/chat/' + id, function (message) {

            const data = JSON.parse(message.body);

            addMessage(
                data.senderName,
                data.text,
                data.createdAt
            );
        });

    };

    client.activate();

    sendButton.addEventListener('click', sendMessage);

    messageInput.addEventListener('keydown', function (event) {

        if (event.key === 'Enter') {
            sendMessage();
        }

    });

    function sendMessage() {

        const text = messageInput.value.trim();

        if (text === '') {
            return;
        }

        client.publish({
            destination: '/app/chat/' + id,
            body: JSON.stringify({
                text: text
            })
        });

        messageInput.value = '';
    }

    function addMessage(sender, text, createdAt) {

        const message = document.createElement('div');

        message.style.maxWidth = '65%';
        message.style.padding = '8px 12px';
        message.style.borderRadius = '8px';
        message.style.background = '#005c4b';
        message.style.alignSelf = 'flex-end';
        message.style.color = 'white';

        message.textContent = sender + ': ' + text;

        chatWindow.appendChild(message);

        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

</script>
