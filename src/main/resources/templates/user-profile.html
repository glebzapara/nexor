<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Profile</title>
    <link rel="icon" type="image/svg+xml" href="/images/favicon.ico">
</head>

<body style="
    margin:0;
    padding:0;
    background:#202c33;
    color:white;
    font-family:Arial, sans-serif;
    display:flex;
    flex-direction:column;
    min-height:100vh;
">

<nav style="
    background:#202c33;
    padding:12px 20px;
    border-bottom:1px solid rgba(255,255,255,0.12);
    flex-shrink:0;
">

    <table width="100%" cellpadding="0" cellspacing="0">
        <tr>


            <td align="left">

                <a th:href="@{/}"
                   style="
                       font-size:26px;
                       font-weight:700;
                       color:white;
                       text-decoration:none;
                   ">
                    Ne<span style="color:#22c55e;">xor</span>
                </a>

            </td>


            <td align="right">

                <span th:if="${currentUser != null and currentUser.role == 'ROLE_USER'}"
                      style="display:inline-block;">

                    <a th:href="@{/add}"
                       style="
       width: 40px;
       height: 40px;
       border-radius: 8px;
       background: #2a3942;
       color: #00a884;
       font-weight: bold;
       cursor: pointer;
       margin-top: auto;

       display: inline-flex;
       align-items: center;
       justify-content: center;

       text-decoration: none;
       box-sizing: border-box;
       flex-shrink: 0;
   ">
    ➕
</a>

                    &#8202;

                    <a th:href="@{/}"
                       style="
       width: 40px;
       height: 40px;
       border-radius: 8px;
       background: #2a3942;
       color: #00a884;
       font-weight: bold;
       cursor: pointer;
       margin-top: auto;

       display: inline-flex;
       align-items: center;
       justify-content: center;

       text-decoration: none;
       box-sizing: border-box;
       flex-shrink: 0;
   ">
    💬
</a>

                    &#8202;

                    <a th:href="@{/settings}"
                       style="
       width: 40px;
       height: 40px;
       border-radius: 8px;
       background: #2a3942;
       color: #00a884;
       font-weight: bold;
       cursor: pointer;
       margin-top: auto;

       display: inline-flex;
       align-items: center;
       justify-content: center;

       text-decoration: none;
       box-sizing: border-box;
       flex-shrink: 0;
   ">
    ⚙️
</a>

                    &#8202;

                    <span style="
                        color:#52636d;
                        position:relative;
                        top:-2px;
                    ">
                        |
                    </span>

                    &#8202;

                    <a th:href="@{/users/{id}/profile(id=${currentUser.id})}"
                       style="
       width: 40px;
       height: 40px;
       border-radius: 8px;
       background: #2a3942;
       color: #00a884;
       font-weight: bold;
       cursor: pointer;
       margin-top: auto;

       display: inline-flex;
       align-items: center;
       justify-content: center;

       text-decoration: none;
       box-sizing: border-box;
       flex-shrink: 0;
   ">
    👤
</a>

                </span>

            </td>


            <td align="right">

                <span th:if="${currentAdmin != null}"
                      style="display:inline-block;">

                    <form th:action="@{/logout}"
                          method="post"
                          style="
                              margin:0;
                              padding:0;
                          ">

                        <button type="submit"
                                style="
                                    background:#e53935;
                                    color:white;
                                    border:none;
                                    height:32px;
                                    padding:0 28px;
                                    border-radius:6px;
                                    font-weight:600;
                                    cursor:pointer;
                                    font-size:15px;
                                ">
                            Logout
                        </button>

                    </form>

                </span>

            </td>

        </tr>
    </table>

</nav>


<div style="
    flex:1;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:70px 20px 60px 20px;
">

    <div style="
        width:580px;
        background:#202c33;
        border:1px solid rgba(255,255,255,0.12);
        border-radius:12px;
        box-sizing:border-box;
        overflow:hidden;
    ">

        <div style="
            background:#202c33;
            color:white;
            padding:20px;
            border-bottom:1px solid rgba(255,255,255,0.12);
            font-weight:700;
            font-size:20px;
            text-align:center;
        ">
            Profile
        </div>

        <div style="
            padding:40px 35px;
            text-align:center;
        ">

            <img th:if="${user.image != null}"
                 th:src="${user.image}"
                 style="
                     width:110px;
                     height:110px;
                     border-radius:50%;
                     object-fit:cover;
                     border:2px solid #3b4a54;
                 ">

            <div th:if="${user.image == null}"
                 style="
                     width:110px;
                     height:110px;
                     background:#2a3942;
                     color:#22c55e;
                     border:2px solid #3b4a54;
                     border-radius:50%;
                     display:flex;
                     align-items:center;
                     justify-content:center;
                     font-size:38px;
                     font-weight:700;
                     margin:0 auto;
                     box-sizing:border-box;
                 "
                 th:text="${#strings.substring(user.firstName,0,1)}">
            </div>

            <div style="
                font-size:28px;
                font-weight:700;
                margin-top:25px;
                margin-bottom:14px;
            "
                 th:text="${user.firstName + ' ' + user.lastName}">
            </div>

            <div style="
                width:180px;
                height:1px;
                background:rgba(255,255,255,0.15);
                margin:0 auto 30px auto;
            ">
            </div>

            <div style="
                font-size:16px;
                line-height:2;
                text-align:left;
            ">

                <div style="
                    margin-bottom:10px;
                    padding:10px 14px;
                    background:#2a3942;
                    border:1px solid #3b4a54;
                    border-radius:6px;
                ">
                    <b style="
                        color:#22c55e;
                        font-weight:600;
                    ">
                        First name:
                    </b>

                    <span th:text="${user.firstName}"></span>
                </div>


                <div style="
                    margin-bottom:10px;
                    padding:10px 14px;
                    background:#2a3942;
                    border:1px solid #3b4a54;
                    border-radius:6px;
                ">
                    <b style="
                        color:#22c55e;
                        font-weight:600;
                    ">
                        Last name:
                    </b>

                    <span th:text="${user.lastName}"></span>
                </div>


                <div style="
                    margin-bottom:10px;
                    padding:10px 14px;
                    background:#2a3942;
                    border:1px solid #3b4a54;
                    border-radius:6px;
                ">
                    <b style="
                        color:#22c55e;
                        font-weight:600;
                    ">
                        Email:
                    </b>

                    <span th:text="${user.email}"></span>
                </div>

                <div style="
                    padding:10px 14px;
                    background:#2a3942;
                    border:1px solid #3b4a54;
                    border-radius:6px;
                ">
                    <b style="
                        color:#22c55e;
                        font-weight:600;
                    ">
                        Phone:
                    </b>

                    <span th:text="${user.phoneNumber}"></span>
                </div>

            </div>

            <div style="
                margin-top:30px;
                display:flex;
                flex-direction:column;
                align-items:center;
                gap:12px;
            ">

                <form th:if="${currentStudentId == user.id}"
                      th:action="@{/logout}"
                      method="post"
                      style="margin:0;">

                    <button type="submit"
                            style="
                                background:#e53935;
                                color:white;
                                border:none;
                                padding:12px 32px;
                                border-radius:6px;
                                font-weight:600;
                                cursor:pointer;
                                font-size:15px;
                                width:140px;
                            ">
                        Logout
                    </button>

                </form>

<!--                        Delete-->
<!--                    </button>-->

<!--                </form>-->

            </div>

        </div>

    </div>

</div>


<div style="
    width:100%;
    margin-top:auto;
">
    <div th:replace="~{footer :: copy-footer}"></div>
</div>
