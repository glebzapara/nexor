<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="icon" href="/images/favicon.ico">

    <style>
        @media (max-width: 600px) {
            body {
                min-height: 100vh !important;
                min-height: 100dvh !important;
                overflow-x: hidden !important;
            }

            nav {
                padding: 10px 12px !important;
            }

            nav table {
                width: 100% !important;
            }

            nav td {
                vertical-align: middle !important;
            }

            nav a {
                flex-shrink: 0 !important;
            }

            body > div {
                box-sizing: border-box !important;
            }

            body > div[style*="justify-content:center"] {
                padding: 30px 12px 40px 12px !important;
                width: 100% !important;
            }

            body > div[style*="justify-content:center"] > div {
                width: 100% !important;
                max-width: 580px !important;
            }

            body > div[style*="justify-content:center"] > div > div:first-child {
                padding: 16px 12px !important;
                font-size: 19px !important;
            }

            body > div[style*="justify-content:center"] > div > div:nth-child(2) {
                padding: 28px 15px !important;
            }

            body > div[style*="justify-content:center"] img,
            body > div[style*="justify-content:center"] div[style*="border-radius:50%"] {
                width: 95px !important;
                height: 95px !important;
            }

            body > div[style*="justify-content:center"] div[style*="font-size:28px"] {
                font-size: 23px !important;
                line-height: 1.3 !important;
                word-break: break-word !important;
            }

            body > div[style*="justify-content:center"] div[style*="width:180px"] {
                width: 130px !important;
                margin-bottom: 24px !important;
            }

            body > div[style*="justify-content:center"] div[style*="font-size:16px"][style*="line-height:2"] {
                font-size: 15px !important;
                line-height: 1.6 !important;
            }

            body > div[style*="justify-content:center"] div[style*="font-size:16px"][style*="line-height:2"] > div {
                padding: 10px 11px !important;
                overflow-wrap: anywhere !important;
            }

            body > div[style*="justify-content:center"] div[style*="font-size:16px"][style*="line-height:2"] b {
                display: inline-block !important;
                margin-right: 4px !important;
            }

            body > div[style*="justify-content:center"] form button {
                width: 140px !important;
            }

            body > div:last-child {
                margin-top: auto !important;
            }
        }

        @media (max-width: 380px) {
            nav {
                padding: 8px 8px !important;
            }

            nav a {
                width: 36px !important;
                height: 36px !important;
            }

            body > div[style*="justify-content:center"] {
                padding: 20px 8px 30px 8px !important;
            }

            body > div[style*="justify-content:center"] > div > div:nth-child(2) {
                padding: 24px 11px !important;
            }

            body > div[style*="justify-content:center"] div[style*="font-size:28px"] {
                font-size: 21px !important;
            }
        }
    </style>

</head>
